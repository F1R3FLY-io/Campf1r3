<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rho reduction</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f7f5; color: #1c1c1c;
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .bar { position: fixed; left: 0; right: 0; background: rgba(247,247,245,.9);
    padding: 8px 12px; box-sizing: border-box; }
  #top { top: 0; border-bottom: 1px solid #ddd; }
  #bot { bottom: 0; border-top: 1px solid #ddd; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #note { font-weight: 600; }
  #term { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 22vh; overflow: auto; margin-top: 4px; }
  #row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; min-width: 40px; min-height: 36px; border: 1px solid #bbb;
    border-radius: 6px; background: #fff; color: inherit; }
  input[type=range] { flex: 1 1 140px; min-width: 120px; }
  label { white-space: nowrap; }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 4px; vertical-align: -1px; }
  #legend i.ring { background: none; box-sizing: border-box; border: 2px solid; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="bar">
  <div id="note"></div>
  <div id="term"></div>
</div>
<div id="bot" class="bar">
  <div id="row">
    <button id="prev" aria-label="previous step">&#9664;&#9664;</button>
    <button id="play" aria-label="play or pause">&#10074;&#10074;</button>
    <button id="next" aria-label="next step">&#9654;&#9654;</button>
    <input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="position">
    <label><input id="lab" type="checkbox" checked> names</label>
    <label><input id="spin" type="checkbox" checked> spin</label>
  </div>
  <div id="legend"></div>
</div>
<script>
"use strict";
const DATA = /*DATA*/null;
const F = DATA.frames;
// One colour per constructor (Okabe-Ito palette); position in space is the argument index.
const KIND = {
  par:   ["#0072B2", "| parallel"],
  recv:  ["#D55E00", "for receive (pattern, channel, body)"],
  send:  ["#009E73", "! send (channel, payload)"],
  quote: ["#CC79A7", "@ quote"],
  drop:  ["#56B4E9", "* dereference"],
  new:   ["#B8A400", "new"],
  list:  ["#8C8C8C", ", list"],
  nil:   ["#000000", "Nil"],
  var:   ["#E69F00", "variable"],
  unf:   ["#6A3D9A", "unforgeable name"],
};
const LEAVING = "#C1121F", ARRIVED = "#1B7F3B";
const HOLD = 0.4, STEP_MS = 2800;

const maps = F.map(f => new Map(f.n.map(a => [a[0], a])));
const box = F.map(f => {
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (const a of f.n) for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], a[3 + i]); hi[i] = Math.max(hi[i], a[3 + i]); }
  const c = lo.map((v, i) => (v + hi[i]) / 2);
  let r = 1;
  for (const a of f.n) r = Math.max(r, Math.hypot(a[3] - c[0], a[4] - c[1], a[5] - c[2]));
  return { c, r };
});

const cv = document.getElementById("c"), g = cv.getContext("2d");
const $ = id => document.getElementById(id);
let T = 0, playing = F.length > 1, yaw = -0.7, pitch = 0.5, zoom = 1, last = performance.now();
let W = 0, H = 0, drag = null, pinch = null, shownIdx = -1;
const used = new Set(F.flatMap(f => f.n.map(a => a[1])));
$("legend").innerHTML = Object.entries(KIND).filter(([k]) => used.has(k))
  .map(([, [c, n]]) => `<span><i style="background:${c}"></i>${n}</span>`).join("") +
  `<span><i class="ring" style="border-color:${LEAVING}"></i>component about to react</span>` +
  `<span><i class="ring" style="border-color:${ARRIVED}"></i>just produced</span>` +
  `<span>axes: 1st, 2nd, 3rd argument</span>`;
$("seek").max = Math.max(1, F.length - 1);
if (F.length < 2) $("seek").disabled = true;

function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  g.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const lerp = (a, b, s) => a + (b - a) * s;
const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

function draw() {
  const k = Math.max(0, Math.min(Math.floor(T), F.length - 1)), k1 = Math.min(k + 1, F.length - 1), u = Math.max(0, T - k);
  const s = k1 === k ? 0 : smooth((u - HOLD) / (1 - HOLD));
  const A = maps[k], B = maps[k1];

  // Where each hub is now, and how visible.
  const at = new Map();
  const put = (id, a, b) => {
    if (a && b) at.set(id, { p: [lerp(a[3], b[3], s), lerp(a[4], b[4], s), lerp(a[5], b[5], s)], al: 1, n: s < 0.5 ? a : b });
    else if (a) at.set(id, { p: [a[3], a[4], a[5]], al: 1 - s, n: a });
    else at.set(id, { p: [b[3], b[4], b[5]], al: s, n: b });
  };
  for (const [id, a] of A) put(id, a, B.get(id));
  for (const [id, b] of B) if (!A.has(id)) put(id, null, b);

  // Camera: fit the interpolated bounding ball between the two bars.
  const topH = $("top").offsetHeight, botH = $("bot").offsetHeight;
  const cx = W / 2, cy = topH + (H - topH - botH) / 2;
  const c = box[k].c.map((v, i) => lerp(v, box[k1].c[i], s));
  const r = Math.exp(lerp(Math.log(box[k].r), Math.log(box[k1].r), s));
  const sc = zoom * 0.44 * Math.min(W, H - topH - botH) / r;
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const proj = p => {
    const x = p[0] - c[0], y = p[1] - c[1], z = p[2] - c[2];
    const X = x * cyw - y * syw, D = x * syw + y * cyw;
    return [cx + sc * X, cy - sc * (z * cp - D * sp), D * cp + z * sp];
  };
  for (const v of at.values()) v.q = proj(v.p);

  // Spokes: a spoke is its child plus its parent; it is drawn in the parent's colour.
  const spokes = [];
  const edge = (f, a, al) => {
    if (a[6] < 0) return;
    const ch = at.get(a[0]), pa = at.get(f.n[a[6]][0]);
    spokes.push({ a: pa.q, b: ch.q, col: KIND[f.n[a[6]][1]][0], al, z: (pa.q[2] + ch.q[2]) / 2 });
  };
  for (const [id, a] of A) {
    const b = B.get(id);
    const same = b && a[6] >= 0 && b[6] >= 0 && F[k].n[a[6]][0] === F[k1].n[b[6]][0];
    if (same || k === k1) edge(F[k], a, 1);
    else { edge(F[k], a, 1 - s); if (b) edge(F[k1], b, s); }
  }
  for (const [id, b] of B) if (!A.has(id)) edge(F[k1], b, s);

  g.clearRect(0, 0, W, H);
  g.lineCap = "round";
  g.lineWidth = Math.max(1.2, Math.min(3.2, sc * 0.11));
  spokes.sort((x, y) => x.z - y.z);
  for (const e of spokes) {
    g.globalAlpha = e.al; g.strokeStyle = e.col;
    g.beginPath(); g.moveTo(e.a[0], e.a[1]); g.lineTo(e.b[0], e.b[1]); g.stroke();
  }
  const dot = Math.max(2.4, Math.min(6.5, sc * 0.2));
  const hubs = [...at.values()].sort((x, y) => x.q[2] - y.q[2]);
  const resting = k === k1 || u < HOLD;
  const showLab = $("lab").checked && sc > 9;
  g.font = `${Math.max(10, Math.min(13, sc * 0.5))}px system-ui, sans-serif`;
  for (const h of hubs) {
    g.globalAlpha = h.al;
    g.fillStyle = KIND[h.n[1]][0];
    g.beginPath(); g.arc(h.q[0], h.q[1], dot, 0, 7); g.fill();
    g.strokeStyle = "#f7f7f5"; g.lineWidth = 1; g.stroke();
    if (resting && A.has(h.n[0]) && h.n[7] && !h.n[0].includes(".")) {
      g.strokeStyle = (h.n[7] & 1) ? LEAVING : ARRIVED; g.lineWidth = 2;
      g.beginPath(); g.arc(h.q[0], h.q[1], dot + 4.5, 0, 7); g.stroke();
    }
    if (showLab && (h.n[1] === "var" || h.n[1] === "unf")) { g.fillStyle = "#1c1c1c"; g.fillText(h.n[2], h.q[0] + dot + 3, h.q[1] - dot - 1); }
  }
  g.globalAlpha = 1;

  const idx = (k1 !== k && u >= 0.5 + HOLD / 2) ? k1 : k;
  if (idx !== shownIdx) {
    shownIdx = idx;
    $("note").textContent = `${idx} / ${F.length - 1} — ${F[idx].note}` + (idx === F.length - 1 ? ` — ${DATA.status}` : "");
    $("term").textContent = F[idx].t;
  }
  $("seek").value = T;
  $("play").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
}

function tick(now) {
  const dt = Math.max(0, Math.min(100, now - last)); last = now;
  if (playing) { T += dt / STEP_MS; if (T >= F.length - 1) { T = F.length - 1; playing = false; } }
  if ($("spin").checked && !drag) yaw += dt * 0.00018;
  draw();
  requestAnimationFrame(tick);
}

$("play").onclick = () => { if (!playing && T >= F.length - 1) T = 0; playing = !playing && F.length > 1; };
$("prev").onclick = () => { playing = false; T = Math.max(0, Math.ceil(T) - 1); };
$("next").onclick = () => { playing = false; T = Math.min(F.length - 1, Math.floor(T) + 1); };
$("seek").oninput = e => { playing = false; T = +e.target.value; };

const pts = new Map();
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) drag = [e.clientX, e.clientY];
  else if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zoom }; drag = null; }
});
cv.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()];
    zoom = Math.max(0.3, Math.min(12, pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d));
  } else if (drag) {
    yaw += (e.clientX - drag[0]) * 0.008;
    pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.008));
    drag = [e.clientX, e.clientY];
  }
});
const up = e => { pts.delete(e.pointerId); pinch = null; drag = pts.size === 1 ? [...pts.values()][0] : null; };
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.3, Math.min(12, zoom * Math.exp(-e.deltaY * 0.001))); }, { passive: false });

requestAnimationFrame(tick);
</script>
</body>
</html>
